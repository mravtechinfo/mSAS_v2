<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2e1a"/>
      <stop offset="100%" style="stop-color:#05100a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#34D399"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#6EE7B7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer glow ring -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.15"/>
  <!-- Shield shape -->
  <path d="M256 80 L400 140 L400 280 Q400 380 256 440 Q112 380 112 280 L112 140 Z" 
        fill="none" stroke="url(#accent)" stroke-width="18" stroke-linejoin="round"/>
  <!-- Shield fill glow -->
  <path d="M256 100 L380 152 L380 272 Q380 360 256 416 Q132 360 132 272 L132 152 Z"
        fill="url(#accent)" opacity="0.08"/>
  <!-- Checkmark -->
  <path d="M200 260 L240 300 L320 220" 
        fill="none" stroke="url(#accent-glow)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small dots representing analysis data -->
  <circle cx="392" cy="160" r="12" fill="#10B981" opacity="0.7"/>
  <circle cx="412" cy="200" r="8" fill="#34D399" opacity="0.5"/>
  <circle cx="372" cy="210" r="6" fill="#059669" opacity="0.4"/>
</svg>
