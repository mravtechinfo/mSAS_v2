<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mSAS v2 — Complete Feature Roadmap</title>
<style>
  :root {
    --bg-primary: #0a0a1a;
    --bg-secondary: #12122a;
    --bg-card: #1a1a3e;
    --bg-hover: #222255;
    --text-primary: #e8e8f0;
    --text-secondary: #a0a0c0;
    --text-muted: #6a6a8a;
    --accent: #e94560;
    --accent-glow: rgba(233,69,96,0.3);
    --blue: #4a9eff;
    --green: #2ecc71;
    --orange: #f39c12;
    --purple: #9b59b6;
    --teal: #1abc9c;
    --border: rgba(255,255,255,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, var(--bg-secondary) 0%, #1a0a2e 100%);
    border-bottom: 1px solid var(--border);
    padding: 32px 24px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), #ff6b8a);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; color: #fff;
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .header h1 {
    font-size: 22px; font-weight: 700;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .subtitle { font-size: 13px; color: var(--text-secondary); }
  .header-stats { display: flex; gap: 20px; flex-wrap: wrap; }
  .stat-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: var(--bg-card);
    border-radius: 20px; font-size: 12px; border: 1px solid var(--border);
  }
  .stat-badge .num { font-weight: 700; color: var(--accent); }
  .controls {
    max-width: 1400px; margin: 0 auto; padding: 16px 24px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .search-box {
    flex: 1; min-width: 200px;
    padding: 10px 16px; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-primary); font-size: 14px; outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-card);
    color: var(--text-secondary); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .filter-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .filter-btn.active {
    border-color: var(--accent); color: var(--accent);
    background: rgba(233,69,96,0.1);
  }
  .container { max-width: 1400px; margin: 0 auto; padding: 0 24px 40px; }
  .phase {
    margin: 24px 0; background: var(--bg-secondary);
    border-radius: 12px; border: 1px solid var(--border); overflow: hidden;
  }
  .phase-header {
    padding: 20px 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    transition: background 0.2s; user-select: none;
  }
  .phase-header:hover { background: var(--bg-hover); }
  .phase-header-left { display: flex; align-items: center; gap: 14px; }
  .phase-number {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff; flex-shrink: 0;
  }
  .phase-number.p0 { background: linear-gradient(135deg, var(--teal), #16a085); }
  .phase-number.p1 { background: linear-gradient(135deg, var(--blue), #2980b9); }
  .phase-number.p2 { background: linear-gradient(135deg, var(--purple), #8e44ad); }
  .phase-number.p3 { background: linear-gradient(135deg, var(--orange), #e67e22); }
  .phase-number.p4 { background: linear-gradient(135deg, var(--accent), #c0392b); }
  .phase-number.p5 { background: linear-gradient(135deg, var(--green), #27ae60); }
  .phase-number.p6 { background: linear-gradient(135deg, #e74c3c, #c0392b); }
  .phase-number.p7 { background: linear-gradient(135deg, #3498db, #2980b9); }
  .phase-number.p8 { background: linear-gradient(135deg, #95a5a6, #7f8c8d); }
  .phase-title { font-size: 17px; font-weight: 600; }
  .phase-meta {
    display: flex; gap: 12px; align-items: center;
    font-size: 12px; color: var(--text-muted);
  }
  .phase-count { padding: 2px 10px; background: var(--bg-card); border-radius: 12px; }
  .phase-arrow { font-size: 18px; color: var(--text-muted); transition: transform 0.3s; }
  .phase.collapsed .phase-arrow { transform: rotate(-90deg); }
  .phase.collapsed .phase-body { display: none; }
  .phase-body { border-top: 1px solid var(--border); padding: 0; }
  .feature-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .feature-table thead { position: sticky; top: 160px; z-index: 10; }
  .feature-table th {
    padding: 12px 16px; text-align: left; font-weight: 600;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-muted); background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
  }
  .feature-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .feature-table tr:hover td { background: rgba(255,255,255,0.02); }
  .feature-id {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px; color: var(--accent); white-space: nowrap;
  }
  .feature-title { font-weight: 500; margin-bottom: 2px; }
  .feature-desc { font-size: 12px; color: var(--text-secondary); }
  .mastg-ref {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-family: 'SF Mono', monospace;
    background: rgba(74,158,255,0.1); color: var(--blue);
    margin: 1px 2px; white-space: nowrap;
  }
  .mastg-ref.checklist {
    background: rgba(46,204,113,0.1); color: var(--green);
  }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .badge-critical { background: rgba(233,69,96,0.2); color: var(--accent); }
  .badge-high { background: rgba(243,156,18,0.2); color: var(--orange); }
  .badge-medium { background: rgba(74,158,255,0.2); color: var(--blue); }
  .badge-low { background: rgba(149,165,166,0.2); color: #95a5a6; }
  .badge-easy { background: rgba(46,204,113,0.2); color: var(--green); }
  .badge-moderate { background: rgba(26,188,156,0.2); color: var(--teal); }
  .badge-hard { background: rgba(243,156,18,0.2); color: var(--orange); }
  .badge-complex { background: rgba(233,69,96,0.2); color: var(--accent); }
  .state-dot { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }
  .state-dot::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%; display: inline-block;
  }
  .state-dot.none::before { background: #555; }
  .state-dot.partial::before { background: var(--orange); }
  .state-dot.yes::before { background: var(--green); }
  .effort-bar {
    width: 60px; height: 6px; background: var(--bg-primary);
    border-radius: 3px; overflow: hidden;
    display: inline-block; vertical-align: middle; margin-right: 6px;
  }
  .effort-bar .fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
  .summary-section {
    margin: 32px 0; padding: 24px;
    background: var(--bg-secondary); border-radius: 12px;
    border: 1px solid var(--border);
  }
  .summary-section h2 { font-size: 18px; margin-bottom: 16px; }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .summary-card {
    padding: 16px; background: var(--bg-card);
    border-radius: 8px; border: 1px solid var(--border);
  }
  .summary-card .label {
    font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .summary-card .value { font-size: 24px; font-weight: 700; }
  .summary-card .value.green { color: var(--green); }
  .summary-card .value.blue { color: var(--blue); }
  .summary-card .value.accent { color: var(--accent); }
  .summary-card .value.orange { color: var(--orange); }
  .legend {
    display: flex; gap: 20px; flex-wrap: wrap;
    padding: 16px 24px; font-size: 12px; color: var(--text-secondary);
    border-top: 1px solid var(--border);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-item .swatch { width: 10px; height: 10px; border-radius: 3px; }
  @media (max-width: 768px) {
    .header { padding: 16px; }
    .header h1 { font-size: 18px; }
    .header-stats { gap: 8px; }
    .stat-badge { font-size: 11px; padding: 4px 10px; }
    .controls { padding: 12px 16px; }
    .container { padding: 0 12px 24px; }
    .phase-header { padding: 14px 16px; }
    .phase-title { font-size: 14px; }
    .feature-table { font-size: 12px; }
    .feature-table th, .feature-table td { padding: 8px 10px; }
    .feature-table td:nth-child(4), .feature-table th:nth-child(4),
    .feature-table td:nth-child(5), .feature-table th:nth-child(5) { display: none; }
  }
  @media print {
    .header { position: static; }
    .controls { display: none; }
    .phase.collapsed .phase-body { display: block; }
    .phase-arrow { display: none; }
    .feature-table thead { position: static; }
  }
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="logo">m</div>
      <div>
        <h1>mSAS v2 — Feature Roadmap</h1>
        <div class="subtitle">Mobile Security Analysis Suite · OWASP MASTG-Aligned</div>
      </div>
    </div>
    <div class="header-stats">
      <span class="stat-badge"><span class="num" id="totalFeatures">0</span> Features</span>
      <span class="stat-badge"><span class="num">9</span> Phases</span>
      <span class="stat-badge"><span class="num">~105</span> Est. Days</span>
      <span class="stat-badge"><span class="num">90%+</span> MASTG Coverage</span>
    </div>
  </div>
</header>

<div class="controls">
  <input type="text" class="search-box" id="searchBox" placeholder="Search features, MASTG IDs, keywords..." oninput="filterFeatures()">
  <div class="filter-group">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('critical', this)">🔴 Critical</button>
    <button class="filter-btn" onclick="setFilter('high', this)">🟠 High</button>
    <button class="filter-btn" onclick="setFilter('medium', this)">🔵 Medium</button>
    <button class="filter-btn" onclick="setFilter('easy', this)">🟢 Quick Win</button>
  </div>
  <button class="filter-btn" onclick="expandAll()" style="margin-left:auto">Expand All</button>
  <button class="filter-btn" onclick="collapseAll()">Collapse All</button>
</div>

<div class="container" id="app"></div>

<script>
const PHASES = [
  { num: 0, title: 'Shared Foundation', subtitle: 'Core infrastructure to enable all downstream work', color: 'p0', features: [
    { id: 'BASE-1', title: 'Shared Module System', desc: 'Extract entropy, crypto, hashing, formatting into shared/ directory. Convert from IIFE to ES module pattern with import/export.', mastg: [], state: 'none', impact: 'critical', effort: 'moderate', days: 3 },
    { id: 'BASE-2', title: 'Declarative Rule Engine', desc: 'Pure-function rule engine that takes context + returns findings. Load rules from data-driven definitions. Enable/disable/prioritize at runtime.', mastg: [], state: 'none', impact: 'critical', effort: 'hard', days: 5 },
    { id: 'BASE-3', title: 'Event-Driven State Store', desc: 'Lightweight Pub/Sub store so UI reacts to state changes instead of manually updating DOM.', mastg: [], state: 'none', impact: 'high', effort: 'moderate', days: 2 },
    { id: 'BASE-4', title: 'Unified PDF Report Builder', desc: 'Merge 3 separate PDF generators into one shared module with consistent branding, MASTG refs, CVSS scores.', mastg: [], state: 'partial', impact: 'high', effort: 'moderate', days: 3 },
    { id: 'BASE-5', title: 'Test Infrastructure', desc: 'Vitest for unit tests, Playwright for E2E, fixture APKs/IPAs. CI pipeline in GitHub Actions.', mastg: [], state: 'yes', impact: 'critical', effort: 'moderate', days: 3 },
    { id: 'BASE-6', title: 'Shared CSS Variables & Theme', desc: 'Consolidate 3 stylesheets into single CSS architecture with design tokens and dark theme.', mastg: [], state: 'yes', impact: 'medium', effort: 'easy', days: 1 },
  ]},
  { num: 1, title: 'Core MASTG — Storage & Data', subtitle: 'MASVS-STORAGE: Data storage, logging, caching', color: 'p1', features: [
    { id: 'STO-1', title: 'SQLite Database Scanner', desc: 'Extract .db/.sqlite files from APK. Parse schema, flag unencrypted DBs with sensitive columns. Detect Realm files.', mastg: ['MSTG-STORAGE-1'], state: 'yes', impact: 'critical', effort: 'moderate', days: 2 },
    { id: 'STO-2', title: 'SharedPreferences Audit', desc: 'Scan XML for MODE_WORLD_READABLE/WRITABLE. Detect plaintext sensitive preference names.', mastg: ['MSTG-STORAGE-1'], state: 'yes', impact: 'high', effort: 'easy', days: 1 },
    { id: 'STO-3', title: 'Log Statement Scanner', desc: 'Full DEX scan for Log.d/e/i/v/w, System.out.print, System.err.print. Classify severity.', mastg: ['MSTG-STORAGE-2'], state: 'yes', impact: 'high', effort: 'easy', days: 1 },
    { id: 'STO-4', title: 'Firebase Database Detection', desc: 'Regex scan for *.firebaseio.com patterns. Check unauthenticated Firebase access.', mastg: ['MSTG-STORAGE-1'], state: 'yes', impact: 'critical', effort: 'easy', days: 0.5 },
    { id: 'STO-5', title: 'Clipboard & Pasteboard Analysis', desc: 'Android: Flag ClipboardManager usage. iOS: Detect UIPasteboard for sensitive data.', mastg: ['MSTG-STORAGE-3'], state: 'yes', impact: 'medium', effort: 'easy', days: 0.5 },
    { id: 'STO-6', title: 'Screenshot Prevention Check', desc: 'Android: Check FLAG_SECURE. iOS: Detect screenshot notification handling.', mastg: ['MSTG-STORAGE-4'], state: 'yes', impact: 'medium', effort: 'easy', days: 0.5 },
    { id: 'STO-7', title: 'Keychain / Keystore Analysis', desc: 'Android Keystore vs SharedPrefs. iOS Keychain kSecAttrAccessible levels.', mastg: ['MSTG-STORAGE-5'], state: 'yes', impact: 'critical', effort: 'moderate', days: 2 },
    { id: 'STO-8', title: 'Push Notification Data Leakage', desc: 'Scan for sensitive data in FCM/APNs notification payload patterns.', mastg: ['MSTG-STORAGE-8'], state: 'yes', impact: 'medium', effort: 'moderate', days: 1 },
    { id: 'STO-9', title: 'Analytics SDK Data Leakage', desc: 'Detect Firebase Analytics, Mixpanel, Amplitude. Check if PII sent to analytics.', mastg: ['MSTG-STORAGE-9'], state: 'yes', impact: 'medium', effort: 'moderate', days: 1.5 },
    { id: 'STO-10', title: 'Device Access Controls', desc: 'Verify screen lock detection, device admin policies, root/jailbreak detection.', mastg: ['MSTG-STORAGE-10'], state: 'yes', impact: 'medium', effort: 'moderate', days: 1 },
    { id: 'STO-11', title: 'Cache & Temp File Analysis', desc: 'Scan for cache dir usage. Flag sensitive data in webview caches.', mastg: ['MSTG-STORAGE-6'], state: 'yes', impact: 'medium', effort: 'moderate', days: 1.5 },
    { id: 'STO-12', title: 'Backup Vulnerability Scanner', desc: 'Android allowBackup/fullBackupContent. iOS NSKeys/UIManagedDocument.', mastg: ['MSTG-STORAGE-7'], state: 'yes', impact: 'high', effort: 'easy', days: 1 },
    { id: 'STO-13', title: 'Scoped Storage Audit', desc: 'Check legacy getExternalStorageDirectory, MANAGE_EXTERNAL_STORAGE permission.', mastg: ['MSTG-STORAGE-1'], state: 'yes', impact: 'medium', effort: 'easy', days: 0.5 },
  ]},
  { num: 2, title: 'Core MASTG — Crypto & Authentication', subtitle: 'MASVS-CRYPTO + MASVS-AUTH', color: 'p2', features: [
    { id: 'CRY-1', title: 'Weak Cipher Suite Detection', desc: 'Detect AES-ECB, DES, RC2, RC4, MD2-5, SHA1 in signing. Hardcoded IVs and static salts.', mastg: ['MSTG-CRYPTO-1','MSTG-CRYPTO-2'], state: 'yes', impact: 'critical', effort: 'moderate', days: 2 },
    { id: 'CRY-2', title: 'Certificate & Signature Validation', desc: 'Verify cert chain, hostname verification, custom TrustManager, X509TrustManager overrides.', mastg: ['MSTG-CRYPTO-3'], state: 'yes', impact: 'critical', effort: 'hard', days: 3 },
    { id: 'CRY-3', title: 'Hardcoded Crypto Keys Scanner', desc: 'Detect hardcoded AES/RSA keys, Base64 keys, .jks/.bks/.p12 keystore files.', mastg: ['MSTG-CRYPTO-4'], state: 'yes', impact: 'critical', effort: 'moderate', days: 2 },
    { id: 'CRY-4', title: 'Custom Crypto Detection', desc: 'Flag custom algorithms, MessageDigest without provider, insecure SecureRandom.', mastg: ['MSTG-CRYPTO-5'], state: 'yes', impact: 'high', effort: 'moderate', days: 2 },
    { id: 'CRY-5', title: 'Random Number Generator Audit', desc: 'SecureRandom vs Random, predictable seeds, Math.random for security.', mastg: ['MSTG-CRYPTO-6'], state: 'yes', impact: 'medium', effort: 'easy', days: 0.5 },
    { id: 'CRY-6', title: 'Certificate Pinning Verification', desc: 'Parse network_security_config pin-set, OkHttp certificatePinner, TrustKit.', mastg: ['MSTG-NETWORK-4'], state: 'yes', impact: 'high', effort: 'moderate', days: 2 },
    { id: 'AUTH-1', title: 'PIN / Password Policy Analysis', desc: 'Extract password policy: min length, complexity, lockout, biometric fallback.', mastg: ['MSTG-AUTH-1'], state: 'yes', impact: 'high', effort: 'moderate', days: 1.5 },

    { id: 'AUTH-4', title: 'OAuth 2.0 / PKCE Verification', desc: 'Detect OAuth flows. Check PKCE, redirect URI validation, state param, implicit grant.', mastg: ['MSTG-AUTH-5'], state: 'yes', impact: 'high', effort: 'hard', days: 3 },
    { id: 'AUTH-5', title: 'Local Auth Bypass Detection', desc: 'isAuthenticated flag manipulation, root detect bypass, cert override, debug bypasses.', mastg: ['MSTG-AUTH-8'], state: 'yes', impact: 'high', effort: 'moderate', days: 2 },
  ]},
  { num: 3, title: 'Core MASTG — Network & Platform', subtitle: 'MASVS-NETWORK + MASVS-PLATFORM', color: 'p3', features: [

    { id: 'NET-3', title: 'Custom Hostname Verifier', desc: 'ALLOW_ALL_HOSTNAME_VERIFIER, custom HostnameVerifier ignoring all hosts.', mastg: ['MSTG-NETWORK-3'], state: 'yes', impact: 'critical', effort: 'moderate', days: 1.5 },
    { id: 'NET-4', title: 'Insecure WebSocket Detection', desc: 'Detect ws:// connections, insecure Socket.IO, STOMP over plain WebSocket.', mastg: ['MSTG-NETWORK-1'], state: 'yes', impact: 'high', effort: 'easy', days: 0.5 },
    { id: 'NET-5', title: '3rd-Party Network SDK Audit', desc: 'Version-check OkHttp, Retrofit, AFNetworking, Alamofire for known CVEs.', mastg: ['MSTG-NETWORK-5'], state: 'yes', impact: 'high', effort: 'moderate', days: 2 },
    { id: 'NET-6', title: 'iOS ATS Deep Analysis', desc: 'Parse full NSAppTransportSecurity: NSAllowsArbitraryLoads, exception domains, TLS exceptions.', mastg: ['MSTG-NETWORK-1'], state: 'yes', impact: 'high', effort: 'moderate', days: 1.5 },
    { id: 'PLAT-1', title: 'WebView Security Audit', desc: 'setJavaScriptEnabled, file access, addJavascriptInterface, remote debugging.', mastg: ['MSTG-PLATFORM-1','MSTG-PLATFORM-2'], state: 'yes', impact: 'critical', effort: 'moderate', days: 2 },
    { id: 'PLAT-2', title: 'Deep Link Validation', desc: 'autoVerify, URL validation logic, Android App Links / iOS Universal Links.', mastg: ['MSTG-PLATFORM-3'], state: 'yes', impact: 'high', effort: 'moderate', days: 2 },
    { id: 'PLAT-3', title: 'Tapjacking / Overlay Detection', desc: 'FLAG_WINDOW_IS_OBSCURED, overlay permission, SYSTEM_ALERT_WINDOW.', mastg: ['MSTG-PLATFORM-9'], state: 'yes', impact: 'high', effort: 'moderate', days: 1.5 },
    { id: 'PLAT-4', title: 'PendingIntent Security', desc: 'FLAG_IMMUTABLE vs MUTABLE, PendingIntent.FLAG_UPDATE_CURRENT misuse.', mastg: ['MSTG-PLATFORM-8'], state: 'yes', impact: 'high', effort: 'moderate', days: 1.5 },
    { id: 'PLAT-5', title: 'Content Provider Security', desc: 'SQL injection in query/update/delete, URI permission grants, path traversal.', mastg: ['MSTG-PLATFORM-4'], state: 'yes', impact: 'high', effort: 'moderate', days: 2 },
    { id: 'PLAT-6', title: 'Service & Broadcast Receiver Audit', desc: 'Exported services/receivers, implicit intent vulns, permission enforcement.', mastg: ['MSTG-PLATFORM-5'], state: 'yes', impact: 'high', effort: 'moderate', days: 1.5 },
    { id: 'PLAT-7', title: 'iOS URL Scheme Hijacking', desc: 'CFBundleURLSchemes interception, universal link fallback issues.', mastg: ['MSTG-PLATFORM-3'], state: 'yes', impact: 'high', effort: 'moderate', days: 1.5 },
    { id: 'PLAT-8', title: 'iOS Keyboard Extension Audit', desc: 'Custom keyboard extensions, keylogging risks, secure text entry.', mastg: ['MSTG-PLATFORM-6'], state: 'yes', impact: 'medium', effort: 'moderate', days: 1 },

function render() {
  const app = document.getElementById('app');
  let html = '';

  // Phase sections
  PHASES.forEach((phase, phaseIdx) => {
    const effortDays = phase.features.reduce((s, f) => s + f.days, 0);
    const featCount = phase.features.length;
    let rows = '';
    phase.features.forEach(f => {
      const mastgRefs = f.mastg.map(m => `<span class="mastg-ref">${m}</span>`).join('');
      const stateLabel = f.state === 'none' ? 'Missing' : f.state === 'partial' ? 'Partial' : 'Complete';
      const stateClass = f.state;
      const effortPct = f.effort === 'easy' ? 25 : f.effort === 'moderate' ? 50 : f.effort === 'hard' ? 75 : 100;
      const effortColor = f.effort === 'easy' ? 'var(--green)' : f.effort === 'moderate' ? 'var(--orange)' : 'var(--accent)';
      rows += `<tr data-impact="${f.impact}" data-effort="${f.effort}" data-state="${f.state}" data-search="${f.id} ${f.title} ${f.desc} ${f.mastg.join(' ')}">
        <td><span class="feature-id">${f.id}</span></td>
        <td><div class="feature-title">${f.title}</div><div class="feature-desc">${f.desc}</div></td>
        <td>${mastgRefs || '<span style="color:var(--text-muted)">—</span>'}</td>
        <td><span class="badge badge-${f.impact}">${f.impact.toUpperCase()}</span></td>
        <td><span class="badge badge-${f.effort}">${f.effort.toUpperCase()}</span></td>
        <td><span class="state-dot ${stateClass}">${stateLabel}</span></td>
        <td><span class="effort-bar"><span class="fill" style="width:${effortPct}%;background:${effortColor}"></span></span>${f.days}d</td>
      </tr>`;
    });

    html += `<div class="phase" id="phase-${phaseIdx}">
      <div class="phase-header" onclick="togglePhase(${phaseIdx})">
        <div class="phase-header-left">
          <div class="phase-number ${phase.color}">${phase.num}</div>
          <div>
            <div class="phase-title">Phase ${phase.num}: ${phase.title}</div>
            <div style="font-size:12px;color:var(--text-secondary);margin-top:2px">${phase.subtitle}</div>
          </div>
        </div>
        <div class="phase-meta">
          <span class="phase-count">${featCount} features</span>
          <span class="phase-count">~${effortDays}d</span>
          <span class="phase-arrow">▼</span>
        </div>
      </div>
      <div class="phase-body">
        <table class="feature-table">
          <thead><tr>
            <th style="width:80px">ID</th>
            <th style="width:35%">Feature</th>
            <th style="width:20%">MASTG / Checklist</th>
            <th style="width:80px">Impact</th>
            <th style="width:90px">Feasibility</th>
            <th style="width:80px">Status</th>
            <th style="width:70px">Effort</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="legend">
          <span class="legend-item"><span class="swatch" style="background:var(--accent)"></span> Critical/High</span>
          <span class="legend-item"><span class="swatch" style="background:var(--blue)"></span> Medium</span>
          <span class="legend-item"><span class="swatch" style="background:var(--green)"></span> Easy/Quick Win</span>
          <span class="legend-item"><span class="swatch" style="background:#555"></span> Missing</span>
          <span class="legend-item"><span class="swatch" style="background:var(--orange)"></span> Partial</span>
          <span class="legend-item"><span class="swatch" style="background:var(--green)"></span> Complete</span>
        </div>
      </div>
    </div>`;
  });

  app.innerHTML = html;
}

function togglePhase(idx) {
  document.getElementById('phase-' + idx).classList.toggle('collapsed');
}
function expandAll() {
  document.querySelectorAll('.phase').forEach(el => el.classList.remove('collapsed'));
}
function collapseAll() {
  document.querySelectorAll('.phase').forEach(el => el.classList.add('collapsed'));
}
function setFilter(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const searchTerm = document.getElementById('searchBox').value.toLowerCase();
  document.querySelectorAll('.feature-table tbody tr').forEach(row => {
    const impact = row.dataset.impact;
    const effort = row.dataset.effort;
    let matchesFilter = true;
    if (filter === 'critical') matchesFilter = impact === 'critical';
    else if (filter === 'high') matchesFilter = impact === 'critical' || impact === 'high';
    else if (filter === 'medium') matchesFilter = ['critical','high','medium'].includes(impact);
    else if (filter === 'easy') matchesFilter = effort === 'easy';
    const searchText = row.dataset.search?.toLowerCase() || '';
    row.style.display = (matchesFilter && (!searchTerm || searchText.includes(searchTerm))) ? '' : 'none';
  });
  document.querySelectorAll('.phase').forEach(phase => {
    const total = phase.querySelectorAll('.feature-table tbody tr').length;
    const hidden = phase.querySelectorAll('.feature-table tbody tr[style*="display: none"]').length;
    phase.style.display = hidden < total ? '' : 'none';
  });
}
function filterFeatures() {
  const active = document.querySelector('.filter-btn.active');
  if (active) setFilter(active.textContent.trim().toLowerCase(), active);
}

// Summary cards
function countBy(fn) { let c=0; PHASES.forEach(p=>p.features.forEach(f=>{if(fn(f))c++})); return c; }
const total = countBy(()=>true);
const critical = countBy(f=>f.impact==='critical'||f.impact==='high');
const easy = countBy(f=>f.effort==='easy');
const existing = countBy(f=>f.state==='partial'||f.state==='yes');
const newFeat = total - existing;

document.getElementById('totalFeatures').textContent = total;

// Add summary to top
const summaryHTML = `
<div class="summary-section">
  <h2>📊 Roadmap Overview</h2>
  <div class="summary-grid">
    <div class="summary-card"><div class="label">Total Features</div><div class="value blue">${total}</div></div>
    <div class="summary-card"><div class="label">Critical / High</div><div class="value accent">${critical}</div></div>
    <div class="summary-card"><div class="label">Quick Wins (Easy)</div><div class="value green">${easy}</div></div>
    <div class="summary-card"><div class="label">Already in v1</div><div class="value orange">${existing}</div></div>
    <div class="summary-card"><div class="label">New for v2</div><div class="value accent">${newFeat}</div></div>
    <div class="summary-card"><div class="label">Est. Development</div><div class="value blue">~105 days</div></div>
  </div>
</div>`;

render();
document.getElementById('app').innerHTML = summaryHTML + document.getElementById('app').innerHTML;
</script>
